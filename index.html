<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Social Hub</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
main{max-width:520px;margin:auto;padding:22px 16px 32px}
header{padding:12px 4px 22px}h1{margin:0 0 6px;font-size:30px}p{margin:0;color:#667085}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
a{min-height:120px;text-decoration:none;color:inherit;background:white;border:1px solid #e6e8ee;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 18px rgba(16,24,40,.05)}
.icon{font-size:34px}.name{font-size:17px;font-weight:700}.open{font-size:13px;color:#667085}
footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:22px}
@media(max-width:360px){.grid{grid-template-columns:1fr}a{min-height:100px}}
</style>
</head>
<body>
<main>
<header>
<h1>Social Hub</h1>
<p>Open your favorite social platforms.</p>
</header>
<section class="grid" aria-label="Social platforms">
<a href="https://www.threads.net/" target="_blank" rel="noopener"><span class="icon">🧵</span><span class="name">Threads</span><span class="open">Open ↗</span></a>
<a href="https://www.facebook.com/" target="_blank" rel="noopener"><span class="icon">📘</span><span class="name">Facebook</span><span class="open">Open ↗</span></a>
<a href="https://www.instagram.com/" target="_blank" rel="noopener"><span class="icon">📸</span><span class="name">Instagram</span><span class="open">Open ↗</span></a>
<a href="https://www.tiktok.com/" target="_blank" rel="noopener"><span class="icon">🎵</span><span class="name">TikTok</span><span class="open">Open ↗</span></a>
<a href="https://web.whatsapp.com/" target="_blank" rel="noopener"><span class="icon">💬</span><span class="name">WhatsApp Web</span><span class="open">Open ↗</span></a>
<a href="https://x.com/" target="_blank" rel="noopener"><span class="icon">𝕏</span><span class="name">X</span><span class="open">Open ↗</span></a>
</section>
<footer>Telegram Mini App • Social Hub</footer>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 400px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Threads</h1>
    <p>Open Threads inside Telegram</p>

    <button id="openThreads">
      Open Threads
    </button>
  </div>

  <script>
    document.getElementById("openThreads").addEventListener("click", function () {
      window.location.href = "https://www.threads.net/";
    });
  </script>

</body>
  </html>
